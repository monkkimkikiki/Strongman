name: Build installable BulkNote APK

on:
  workflow_dispatch:
  push:
    branches: [feature/offline-ai-coach]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/offline-ai-coach
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build APK
        run: gradle assembleDebug --no-daemon
      - name: Verify APK
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: bulk-note-analysis-export-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
