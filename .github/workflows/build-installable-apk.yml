name: Build installable DolsoeRox APK

on:
  workflow_dispatch:
  push:
    branches: [feature/offline-ai-coach]

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/offline-ai-coach
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Clean up previous APK artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, { owner, repo, per_page: 100 });
            const oldApks = artifacts.filter(a => a.name === 'bulk-note-analysis-export-apk');
            for (const artifact of oldApks) {
              await github.rest.actions.deleteArtifact({ owner, repo, artifact_id: artifact.id });
              core.info(`Deleted old APK artifact ${artifact.name} (#${artifact.id})`);
            }
      - name: Build APK
        run: gradle assembleDebug --no-daemon
      - name: Verify APK
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: bulknote-v1.45
          name: 돌쇠록스 v1.45
          files: app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
          make_latest: true
