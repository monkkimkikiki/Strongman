name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require signing key
        run: |
          test -f bulknote.keystore && test -f keystore.properties || { echo "::error::서명 키가 없어 빌드를 중단해요 (APK가 매번 다른 키로 서명되는 것을 막기 위함)"; exit 1; }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Set build number
        run: sed -i "s/__BUILD__/${{ github.run_number }}/" app/src/main/assets/index.html
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: bulknote-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk bulknote.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest bulknote.apk --title "벌크업 노트 APK" --notes "폰에서 bulknote.apk 를 받아 설치하세요. (개인용 debug 서명)" --target ${{ github.sha }}
