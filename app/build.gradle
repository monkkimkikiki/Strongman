plugins {
    id 'com.android.application'
}

def ksFile = rootProject.file('keystore.properties')
def ksProps = new Properties()
if (ksFile.exists()) {
    ksFile.withInputStream { ksProps.load(it) }
}

android {
    namespace 'com.bulknote.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.bulknote.personal'
        minSdk 26
        targetSdk 34
        versionCode 50
        versionName '1.50'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        personal {
            if (ksFile.exists()) {
                storeFile rootProject.file(ksProps['storeFile'])
                storePassword ksProps['storePassword']
                keyAlias ksProps['keyAlias']
                keyPassword ksProps['keyPassword']
            }
            enableV1Signing true
            enableV2Signing true
        }
    }

    buildTypes {
        debug {
            if (ksFile.exists()) {
                signingConfig signingConfigs.personal
            }
        }
        release {
            minifyEnabled false
            if (ksFile.exists()) {
                signingConfig signingConfigs.personal
            }
        }
    }
}
